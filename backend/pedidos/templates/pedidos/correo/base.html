<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#27272a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td style="background:#c2410c;color:#ffffff;padding:18px 24px;font-size:20px;font-weight:bold;">DomiPedidosX</td></tr>
        <tr><td style="padding:24px;">
          <h1 style="margin:0 0 8px;font-size:22px;">{% block titular %}{% endblock %}</h1>
          <p style="margin:0 0 16px;">Hola {{ cliente }},</p>
          {% block contenido %}{% endblock %}
          <p style="margin:24px 0 0;"><a href="{{ enlace }}" style="background:#c2410c;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;display:inline-block;">Ver mi pedido</a></p>
        </td></tr>
        <tr><td style="padding:16px 24px;background:#fafafa;color:#71717a;font-size:12px;">
          Pedido {{ numero }} · {{ sede }}. Este correo es automático, no respondas a este mensaje.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
