name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: domipedidosx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: clave-solo-para-ci
      DJANGO_DEBUG: "False"
      DB_NAME: domipedidosx
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt
      - run: .venv/bin/python manage.py check
      # Checklist de producción de Django (docs/seguridad.md). Solo las comprobaciones
      # de seguridad: los avisos de drf_spectacular son de la documentación Swagger.
      # La clave corta de arriba hace fallar security.W009 (pide 50+ caracteres). Aquí se
      # usa una aleatoria y larga, como la que debe tener Render.
      - run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            .venv/bin/python manage.py check --deploy --tag security --fail-level WARNING
      # Dependencias con vulnerabilidades conocidas
      - run: .venv/bin/pip install pip-audit
      - run: .venv/bin/pip-audit -r requirements.txt
      - run: .venv/bin/python manage.py makemigrations --check --dry-run
      - run: .venv/bin/python manage.py migrate
      - run: .venv/bin/pytest
