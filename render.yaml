# SCRUM-143 · Blueprint de Render: backend (Django + Daphne) y Redis.
# La base de datos y las imágenes van en Supabase; el frontend en Vercel.
# Paso a paso en docs/despliegue.md.
services:
  # Redis: canal de los WebSockets y cola de Celery. Solo accesible desde Render.
  - type: keyvalue
    name: domipedidosx-redis
    plan: free
    region: virginia  # misma región que Supabase (East US) para que sea rápido
    ipAllowList: []

  - type: web
    name: domipedidosx-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/docs/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # True: carga seed_datos en cada build (no duplica). Ver docs/despliegue.md.
      - key: CARGAR_DATOS_DEMO
        value: "True"
      # Contraseña del admin@domipedidosx.local que crea seed_datos (solo la primera vez)
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: domipedidosx-redis
          property: connectionString
      # Supabase (Connect > Session pooler)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      # URL del frontend en Vercel (CORS y enlaces de los correos)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Imágenes de productos en Supabase Storage
      - key: STORAGE_BUCKET
        value: productos
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_DOMAIN
        sync: false
      # Correo por la API de Brevo (Render gratis bloquea SMTP)
      - key: EMAIL_BACKEND
        value: anymail.backends.brevo.EmailBackend
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
